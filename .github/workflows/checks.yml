name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src assets tools
      - run: bin/ai-topics-codex validate
      - run: python tools/check-skill-links.py
      - run: python tools/check-public-tree.py
      - run: docker compose -f deploy/compose.yaml config --quiet
