name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src assets tools
      - run: bin/ai-topics-codex validate
      - run: python tools/check-skill-links.py
      - run: python tools/check-public-tree.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g @openai/codex@0.157.1
      - run: sudo tools/setup-linux-sandbox
      - run: bin/ai-topics-codex --profile .local/ci-sandbox init
      - run: bin/ai-topics-codex --profile .local/ci-sandbox sandbox-check
