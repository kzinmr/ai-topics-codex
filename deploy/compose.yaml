services:
  lucy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ai-topics-codex:local
    container_name: ai-topics-codex-lucy
    user: "${WIKI_UID:-1000}:${WIKI_GID:-1000}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    pids_limit: 256
    environment:
      WIKI_CODEX_SANDBOX: external
      WIKI_CONTAINER_ISOLATED: "1"
      WIKI_PROFILE_ROOT: /workspace/profile
      HOME: /workspace/profile
      WIKI_AGENT_HOME: /workspace/profile/.wiki-agent
      WIKI_SUBPROCESS_HOME: /workspace/profile
    volumes:
      - ${LUCY_PROFILE_DIR:-../profiles/lucy}:/workspace/profile
    restart: unless-stopped
    stop_grace_period: 30s
